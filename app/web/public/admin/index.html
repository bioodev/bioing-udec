<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Sveltia CMS</title>
  </head>
  <body>
    <!-- Versión fija con hash: una versión nueva de Sveltia no llega sola al panel. Para actualizar, seguir
         docs/despliegue-cloudflare.md, «Actualizar Sveltia CMS» (la prueba src/lib/panel-sveltia.test.ts lo exige). -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.235.1/dist/sveltia-cms.js"
      integrity="sha384-0buNFRS4cnwrZfClZMgBYxOTaefGGJltRCRnsKTgLl+q0sOGWcd8sgJpgwr1oKUl"
      crossorigin="anonymous"
    ></script>
    <!-- Tema de las vistas previas (claro/oscuro del panel) y su hoja de estilos: van después de Sveltia. -->
    <script type="module" src="/admin/vista-previa-tema.js"></script>
    <!-- Vista previa SEO (ADR 0010): va después de Sveltia, que expone CMS, h y createClass. -->
    <script type="module" src="/admin/vista-previa-seo.js"></script>
    <!-- Vista previa de Banners (slide del carrusel del Inicio): también después de Sveltia. -->
    <script type="module" src="/admin/vista-previa-banner.js"></script>
  </body>
</html>
