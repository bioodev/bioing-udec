                  - { name: imagen, label: Imagen para compartir, widget: image, required: false, hint: "Horizontal, de 1200 × 630 px. Si la dejas vacía, se usa la imagen por defecto del sitio." }
          - name: verificacion
            label: Verificación de buscadores
            widget: object
            collapsed: true
            required: false
            hint: "Códigos que entregan Google y Bing para confirmar que el sitio es de la carrera. Solo el código, no la etiqueta HTML completa."
            fields:
              - { name: google, label: Código de Google Search Console, widget: string, required: false, pattern: ['^[A-Za-z0-9_-]+$', 'Solo el código: sin etiqueta <meta> ni comillas.'], hint: "Es el valor de content=\"…\" de la etiqueta google-site-verification. Ej.: abc123_XYZ-9." }
              - { name: bing, label: Código de Bing Webmaster, widget: string, required: false, pattern: ['^[A-Za-z0-9_-]+$', 'Solo el código: sin etiqueta <meta> ni comillas.'], hint: "Es el valor de content=\"…\" de la etiqueta msvalidate.01." }

  # ── Páginas libres (se crean desde el panel; cada una vive en /p/<slug>) ──

  - name: paginas_libres
    label: Páginas libres
    label_singular: Página libre
    folder: /app/web/src/content/paginas-libres
    identifier_field: titulo
    summary: "{{titulo}} · {{mostrar_en}} {{publicado | ternary('', '(borrador)')}}"
    fields:
      - { name: titulo, label: Título, widget: string }
      - { name: publicado, label: Publicado, widget: boolean, default: false }
      - { name: bajada, label: Bajada, widget: text, hint: "Una o dos líneas. Va bajo el título, en buscadores y en el desplegable del menú." }
      - { name: imagen, label: Imagen destacada, widget: image, required: false }
      - { name: imagen_alt, label: Texto alternativo de la imagen, widget: string, required: false, hint: "Describe lo que se ve en la imagen (para lectores de pantalla). No repitas el título." }
      - name: mostrar_en
        label: Mostrar en
        widget: select
        default: ninguno
        options:
          - { label: "Ninguno (solo se llega por un enlace, p. ej. un Banner)", value: ninguno }
          - { label: Pie de página, value: footer }
          - { label: "Menú «La carrera»", value: la-carrera }
          - { label: "Menú «Comunidad»", value: comunidad }
        hint: "«Menú» la agrega al desplegable del navbar y también al pie. «Pie de página» solo al pie."
      - { name: destacar_inicio, label: Destacar en el Inicio, widget: boolean, default: false, hint: "Se muestra un bloque bajo el carrusel del Inicio. Solo se muestra una página destacada a la vez." }
      - { name: resumen_inicio, label: Resumen para el Inicio, widget: text, required: false, hint: "3 o 4 líneas. Si lo dejas vacío, se usa la bajada." }
      - { name: video, label: Video (YouTube), widget: string, type: url, required: false, hint: "Enlace de YouTube. Se muestra debajo de la bajada, en una ventana al hacer clic." }
      - name: enlaces
        label: Enlaces
        label_singular: Enlace
        widget: list
        required: false
        max: 6
        summary: "{{etiqueta}}"
        hint: "Botones bajo el título: inscripción, transmisión, más información… Para reproducir videos, audios o publicaciones, usa Contenido incrustado."
        fields:
          - { name: etiqueta, label: Texto del botón, widget: string, hint: "Corto, p. ej.: Ver transmisión." }
          - { name: url, label: Dirección, widget: string, pattern: ['^(https://|/[^/])', "Debe empezar con https:// o, si es una página del sitio, con / (p. ej. /agenda)."], hint: "Dirección completa (https://…) o, para una página del sitio, la ruta: /agenda, /p/mi-pagina." }
      - { name: bloques_titulo, label: Título de los bloques destacados, widget: string, required: false, hint: "Aparece sobre los bloques destacados. Déjalo vacío para mostrar solo los bloques." }
      - name: bloques
        label: Bloques destacados
        widget: list
        required: false
        hint: "Se muestran en una franja oscura después del contenido, en dos columnas."
        label_singular: Bloque destacado
        summary: "{{titulo}}"
        fields:
          - { name: titulo, label: Título, widget: string }
          - { name: texto, label: Texto, widget: text }
      - name: incrustados
        label: Contenido incrustado
        label_singular: Contenido incrustado
        widget: list
        required: false
        max: 10
        summary: "{{titulo}} {{url}}"
        hint: "Pega enlaces públicos (https) de Spotify, SoundCloud, YouTube, Vimeo, TikTok, Instagram, Facebook, LinkedIn, Twitch, Google Maps o Google Drive, entre otros: se muestran como reproductor. X y WhatsApp se muestran como enlace."
        fields:
          - { name: url, label: Enlace, widget: string, type: url, hint: "Copia la dirección de la barra del navegador." }
          - { name: titulo, label: Título, widget: string, required: false, hint: "Describe el contenido; lo leen los lectores de pantalla." }
      - *seo_contenido
      - { name: body, label: Contenido, widget: richtext }

  - name: instagram
    label: Instagram
    label_singular: Publicación de Instagram
    folder: /app/web/src/content/instagram
    format: yml
    identifier_field: titulo
    summary: "{{titulo}} · {{fecha | date('YYYY-MM-DD')}} {{publicado | ternary('', '(borrador)')}}"
    fields:
      - { name: titulo, label: Descripción breve, widget: string, hint: Se usa como texto de la tarjeta y para lectores de pantalla. }
      - name: enlace
        label: Enlace de la publicación
        widget: string
        hint: Copia el enlace desde Instagram (Compartir → Copiar enlace). Solo publicaciones o reels.
        pattern: ['^https://(www\.)?instagram\.com/(p|reel)/[\w-]+/?(\?.*)?$', 'Debe ser el enlace de una publicación o reel de Instagram']
      - { name: fecha, label: Fecha, widget: datetime, type: date }
      - { name: publicado, label: Publicado, widget: boolean, default: false }
      - { name: imagen, label: Miniatura (opcional), widget: image, required: false, hint: Captura de la publicación para la tarjeta liviana. }

  # ── Clasificación ───────────────────────────────────────────

  - name: areas
    label: Áreas
    label_singular: Área
    folder: /app/web/src/content/areas
    format: yml
    identifier_field: nombre
    summary: '{{nombre}}'
    fields:
      - { name: nombre, label: Nombre, widget: string }

  - name: temas
    label: Temas
    label_singular: Tema
    folder: /app/web/src/content/temas
    format: yml
    identifier_field: nombre
    summary: '{{nombre}}'
    fields:
      - { name: nombre, label: Nombre, widget: string }
