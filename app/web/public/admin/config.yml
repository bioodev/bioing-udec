      - name: incrustados
        label: Contenido incrustado
        label_singular: Contenido incrustado
        widget: list
        required: false
        max: 10
        summary: "{{titulo}} {{url}}"
        hint: "Pega enlaces públicos (https) de Spotify, SoundCloud, YouTube, Vimeo, TikTok, Instagram, Facebook, LinkedIn, Twitch, Google Maps o Google Drive, entre otros: se muestran como reproductor. X y WhatsApp se muestran como enlace."
