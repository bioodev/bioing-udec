# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Modelo de dominio: ver docs/context.md. Decisión de stack: docs/adr/0001-sveltia-cms-astro.md

backend:
  name: github
  repo: bioodev/bioing-udec
  branch: main
  # PROVISIONAL: repo de prueba del proveedor (cuenta personal bioodev). Se entra con "Iniciar sesión con un
  # token de acceso" (fine-grained PAT con Contents: Read and write sobre este repo). En la Etapa 4 del plan
  # de ambientes pasa a <org>/<repo> con base_url del Worker sveltia-cms-auth (OAuth).

# Imágenes en src/assets para que Astro las optimice (image()). La ruta pública usa el alias `@/` del
# tsconfig (`@/assets/media/…`), que image() resuelve. No declarar media_folder/public_folder por colección
# con la misma carpeta: Sveltia asigna el archivo a la carpeta global y escribe la ruta global igual.
# (El public_folder global no puede ser relativo, `../../…`; con `@` sí se permite.)
media_folder: /app/web/src/assets/media
public_folder: '@/assets/media'

media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        width: 2048
        quality: 85
      heic:
        format: webp
        width: 2048
        quality: 85

slug:
  encoding: ascii
  clean_accents: true

output:
  omit_empty_optional_fields: true

collections:
  # ── Comunidad ───────────────────────────────────────────────

  - name: personas
    label: Personas
    label_singular: Persona
    folder: /app/web/src/content/personas
    format: yml
    identifier_field: nombre
    summary: '{{nombre}}'
    fields:
      - { name: nombre, label: Nombre y apellido, widget: string }
      - name: descripcion
        label: Descripción breve
        widget: string
        required: false
        hint: 'Ej.: "Académica FCB", "Estudiante de Bioingeniería".'
      - { name: foto, label: Foto, widget: image, required: false }
      - name: ficha_activa
        label: Ficha pública activa
        widget: boolean
        default: true
        hint: Si se desactiva, el nombre aparece sin enlace y la Persona sale del Directorio.
      - name: perfil_egresado
        label: Perfil de egresado
        widget: object
        required: false
        collapsed: true
        fields:
          - name: autorizado
            label: Autoriza publicar su perfil
            widget: boolean
            default: false
          - name: generacion # TODO: confirmar significado (docs/preguntas-reunion.md 1.1)
            label: Generación
            widget: number
            value_type: int
            required: false
          - { name: anio_egreso, label: Año de egreso, widget: number, value_type: int }
          - name: areas
            label: Áreas
            widget: relation
            collection: areas
            display_fields: [nombre]
            multiple: true
            required: false
          - name: organizacion
            label: Organización
            widget: relation
            collection: organizaciones
            display_fields: [nombre]
            required: false
          - { name: cargo, label: Cargo / profesión, widget: string, required: false }
          - name: enlaces
            label: Enlaces profesionales
            label_singular: Enlace
            widget: list
            required: false
            fields:
              - { name: etiqueta, label: Etiqueta, widget: string }
              - { name: url, label: URL, widget: string, type: url }

  - name: organizaciones
    label: Organizaciones
    label_singular: Organización
    folder: /app/web/src/content/organizaciones
    format: yml
    identifier_field: nombre
    summary: '{{nombre}} ({{tipo}})'
    fields:
      - { name: nombre, label: Nombre, widget: string }
      - name: tipo
        label: Tipo
        widget: select
        options:
          - { label: Empresa, value: empresa }
          - { label: Institución, value: institucion }
          - { label: Laboratorio, value: laboratorio }
          - { label: Agrupación, value: agrupacion }
      - { name: sitio_web, label: Sitio web, widget: string, type: url, required: false }
      - { name: logo, label: Logo, widget: image, required: false }
      - { name: ficha_activa, label: Ficha pública activa, widget: boolean, default: true }

  # ── Contenidos ──────────────────────────────────────────────

  - name: noticias
    label: Noticias
    label_singular: Noticia
    folder: /app/web/src/content/noticias
    identifier_field: titulo
    summary: "{{titulo}} · {{fecha | date('YYYY-MM-DD')}} {{publicado | ternary('', '(borrador)')}}"
    fields:
      - { name: titulo, label: Título, widget: string }
      - { name: fecha, label: Fecha de publicación, widget: datetime, type: date }
      - { name: publicado, label: Publicado, widget: boolean, default: false }
      - { name: imagen, label: Imagen destacada, widget: image, required: false }
      - { name: imagen_alt, label: Texto alternativo de la imagen, widget: string, required: false, hint: "Describe lo que se ve en la imagen (para lectores de pantalla). No repitas el título." }
      - { name: bajada, label: Bajada, widget: text, required: false }
      - name: etiquetas
        label: Etiquetas (tags)
        label_singular: Etiqueta
        widget: list
        required: false
        hint: Texto libre para etiquetar la Noticia (p. ej. simulación, clínica). Editable por el Encargado de comunicaciones sin crear Temas.
      - { name: temas, label: Temas, widget: relation, collection: temas, display_fields: [nombre], multiple: true, required: false }
      - { name: areas, label: Áreas, widget: relation, collection: areas, display_fields: [nombre], multiple: true, required: false }
      - name: personas_mencionadas
        label: Personas mencionadas
        widget: relation
        collection: personas
        display_fields: [nombre]
        multiple: true
        required: false
      - name: organizaciones_mencionadas
        label: Organizaciones mencionadas
        widget: relation
        collection: organizaciones
        display_fields: [nombre]
        multiple: true
        required: false
      - name: actividad
        label: Actividad que cubre
        widget: relation
        collection: actividades
        display_fields: [titulo]
        required: false
        hint: Solo si la Noticia es la Cobertura de una Actividad ya realizada.
      - { name: instagram, label: Publicación de Instagram relacionada, widget: relation, collection: instagram, display_fields: [titulo], required: false }
      - { name: video, label: Video (YouTube), widget: string, type: url, required: false, hint: "Enlace de YouTube. Se muestra debajo del cuerpo, en una ventana al hacer clic." }
      - name: enlaces
        label: Enlaces
        label_singular: Enlace
        widget: list
        required: false
        max: 6
        summary: "{{etiqueta}}"
        hint: "Botones bajo el título: inscripción, transmisión, más información… Para reproducir videos, audios o publicaciones, usa Contenido incrustado."
        fields:
          - { name: etiqueta, label: Texto del botón, widget: string, hint: "Corto, p. ej.: Ver transmisión." }
          - { name: url, label: Dirección, widget: string, pattern: ['^(https://|/[^/])', "Debe empezar con https:// o, si es una página del sitio, con / (p. ej. /agenda)."], hint: "Dirección completa (https://…) o, para una página del sitio, la ruta: /agenda, /p/mi-pagina." }
      - name: galeria
        label: Galería de imágenes
        label_singular: Imagen
        widget: list
        required: false
        max: 12
        hint: "Hasta 12 imágenes. Se ven en una grilla y, al hacer clic, se amplían."
        fields:
          - { name: imagen, label: Imagen, widget: image }
          - { name: alt, label: Texto alternativo, widget: string, hint: "Describe lo que se ve en la imagen. No repitas el título." }
      - name: incrustados
        label: Contenido incrustado
        label_singular: Contenido incrustado
        widget: list
        required: false
        max: 10
        summary: "{{titulo}} {{url}}"
        hint: "Pega enlaces públicos (https) de Spotify, SoundCloud, YouTube, Vimeo, TikTok, Instagram, Facebook, LinkedIn, Twitch, Google Maps o Google Drive, entre otros: se muestran como reproductor. X y WhatsApp se muestran como enlace."
        fields:
          - { name: url, label: Enlace, widget: string, type: url, hint: "Copia la dirección de la barra del navegador." }
          - { name: titulo, label: Título, widget: string, required: false, hint: "Describe el contenido; lo leen los lectores de pantalla." }
      - &seo_contenido
        name: seo
        label: SEO (opcional)
        widget: object
        collapsed: true
        required: false
        hint: "Solo si quieres que en Google o al compartir se vea distinto. Si lo dejas vacío, se usa el título, la bajada y la imagen destacada."
        fields:
          - { name: titulo, label: Título para buscadores y redes, widget: string, required: false, maxlength: 60, hint: "Máximo 60 caracteres. No hace falta escribir «· BIOING+»: se agrega solo." }
          - { name: descripcion, label: Descripción para buscadores y redes, widget: text, required: false, maxlength: 160, hint: "Una o dos frases, de hasta 160 caracteres. Es el texto que aparece bajo el título en Google." }
          - { name: imagen, label: Imagen para compartir, widget: image, required: false, hint: "Horizontal, de 1200 × 630 px. Si la dejas vacía, se usa la imagen de la página o, si no tiene, la del sitio." }
          - { name: noindex, label: No mostrar en buscadores, widget: boolean, default: false, hint: "La página sigue publicada y enlazada, pero Google no la indexa: sale del buscador del sitio y del mapa del sitio." }
      - { name: body, label: Cuerpo, widget: richtext }

  - name: actividades
    label: Agenda
    label_singular: Actividad
    folder: /app/web/src/content/actividades
    identifier_field: titulo
    summary: "{{titulo}} · {{inicio | date('YYYY-MM-DD')}} {{publicado | ternary('', '(borrador)')}}"
    fields:
      - { name: titulo, label: Nombre de la actividad, widget: string }
      - { name: publicado, label: Publicado, widget: boolean, default: false }
      - name: tipo
        label: Tipo
        widget: select
        options:
          - { label: Seminario, value: seminario }
          - { label: Charla, value: charla }
          - { label: Congreso, value: congreso }
          - { label: Taller, value: taller }
          - { label: Actividad de estudiantes, value: estudiantes }
          - { label: Actividad de egresados/as, value: egresados }
          - { label: Actividad académica, value: academica }
          - { label: Encuentro de la comunidad, value: encuentro }
          - { label: Otra, value: otra }
      - { name: inicio, label: Inicio, widget: datetime, input_timezone: America/Santiago }
      - { name: fin, label: Término, widget: datetime, input_timezone: America/Santiago, required: false }
      - name: modalidad
        label: Modalidad
        widget: select
        options:
          - { label: Presencial, value: presencial }
          - { label: En línea, value: en-linea }
          - { label: Híbrida, value: hibrida }
      - { name: lugar, label: Lugar, widget: string, required: false }
      - name: organizadores
        label: Organizadores
        label_singular: Organizador
        widget: list
        typeKey: tipo
        types:
          - name: persona
            label: Persona
            fields:
              - { name: persona, label: Persona, widget: relation, collection: personas, display_fields: [nombre] }
          - name: organizacion
            label: Organización
            fields:
              - { name: organizacion, label: Organización, widget: relation, collection: organizaciones, display_fields: [nombre] }
      - name: expositores
        label: Expositores
        widget: relation
        collection: personas
        display_fields: [nombre]
        multiple: true
        required: false
      - { name: areas, label: Áreas, widget: relation, collection: areas, display_fields: [nombre], multiple: true, required: false }
      - { name: enlace_inscripcion, label: Enlace de inscripción o información, widget: string, type: url, required: false }
      - name: enlaces
        label: Enlaces
        label_singular: Enlace
        widget: list
        required: false
        max: 6
        summary: "{{etiqueta}}"
        hint: "Botones bajo el título: inscripción, transmisión, más información… Para reproducir videos, audios o publicaciones, usa Contenido incrustado."
        fields:
          - { name: etiqueta, label: Texto del botón, widget: string, hint: "Corto, p. ej.: Ver transmisión." }
          - { name: url, label: Dirección, widget: string, pattern: ['^(https://|/[^/])', "Debe empezar con https:// o, si es una página del sitio, con / (p. ej. /agenda)."], hint: "Dirección completa (https://…) o, para una página del sitio, la ruta: /agenda, /p/mi-pagina." }
      - { name: imagen, label: Imagen, widget: image, required: false }
      - name: incrustados
        label: Contenido incrustado
        label_singular: Contenido incrustado
        widget: list
        required: false
        max: 10
        summary: "{{titulo}} {{url}}"
        hint: "Pega enlaces públicos (https) de Spotify, SoundCloud, YouTube, Vimeo, TikTok, Instagram, Facebook, LinkedIn, Twitch, Google Maps o Google Drive, entre otros: se muestran como reproductor. X y WhatsApp se muestran como enlace."
        fields:
          - { name: url, label: Enlace, widget: string, type: url, hint: "Copia la dirección de la barra del navegador." }
          - { name: titulo, label: Título, widget: string, required: false, hint: "Describe el contenido; lo leen los lectores de pantalla." }
      - *seo_contenido
      - { name: body, label: Descripción, widget: richtext }

  - name: anuncios
    label: Anuncios
    label_singular: Anuncio
    folder: /app/web/src/content/anuncios
    identifier_field: titulo
    summary: "{{titulo}} · {{fecha | date('YYYY-MM-DD')}} {{publicado | ternary('', '(borrador)')}}"
    fields:
      - { name: titulo, label: Título, widget: string }
      - { name: publicado, label: Publicado, widget: boolean, default: false }
      - name: tipo
        label: Tipo de oportunidad
        widget: select
        options:
          - { label: Oferta de trabajo, value: trabajo }
          - { label: Práctica profesional, value: practica }
          - { label: Pasantía, value: pasantia }
          - { label: Proyecto de investigación, value: proyecto }
          - { label: Convocatoria, value: convocatoria }
          - { label: Solicitud de colaboración, value: colaboracion }
          - { label: Otra, value: otra }
      - name: oferente
        label: Oferente
        widget: object
        typeKey: tipo
        types:
          - name: persona
            label: Persona
            fields:
              - { name: persona, label: Persona, widget: relation, collection: personas, display_fields: [nombre] }
          - name: organizacion
            label: Organización
            fields:
              - { name: organizacion, label: Organización, widget: relation, collection: organizaciones, display_fields: [nombre] }
      - { name: areas, label: Áreas, widget: relation, collection: areas, display_fields: [nombre], multiple: true, required: false }
      - { name: fecha, label: Fecha de publicación, widget: datetime, type: date }
      - { name: fecha_limite, label: Fecha límite, widget: datetime, type: date, required: false }
      - name: contacto
        label: Contacto
        widget: string
        hint: Correo, teléfono o enlace. Texto libre; no es una Persona.
      - { name: enlace, label: Enlace externo, widget: string, type: url, required: false }
      - *seo_contenido
      - { name: body, label: Descripción, widget: richtext }

  - name: documentos
    label: Repositorio
    label_singular: Documento
    folder: /app/web/src/content/documentos
    format: yml
    identifier_field: titulo
    summary: "{{titulo}} ({{anio}}) {{publicado | ternary('', '(borrador)')}}"
    fields:
      - { name: titulo, label: Título, widget: string }
      - { name: publicado, label: Publicado, widget: boolean, default: false }
      - name: tipo # TODO: confirmar lista (docs/preguntas-reunion.md 5.3)
        label: Tipo de documento
        widget: select
        options:
          - { label: Decreto, value: decreto }
          - { label: Reglamento, value: reglamento }
          - { label: Ley, value: ley }
          - { label: Informe, value: informe }
          - { label: Publicación, value: publicacion }
          - { label: Documento institucional, value: institucional }
          - { label: Documento histórico, value: historico }
          - { label: Material académico, value: academico }
          - { label: Otro, value: otro }
      - { name: anio, label: Año, widget: number, value_type: int }
      - { name: enlace, label: Enlace al archivo (Drive), widget: string, type: url }
      - { name: descripcion, label: Descripción, widget: text, required: false }
      - { name: temas, label: Temas, widget: relation, collection: temas, display_fields: [nombre], multiple: true, required: false }
      - { name: areas, label: Áreas, widget: relation, collection: areas, display_fields: [nombre], multiple: true, required: false }
      - { name: palabras_clave, label: Palabras clave, widget: list, required: false }
      - *seo_contenido

  - name: banners
    label: Banners
    label_singular: Banner
    folder: /app/web/src/content/banners
    format: yml
    identifier_field: titulo
    summary: "{{titulo}} · {{inicio | date('YYYY-MM-DD')}} → {{fin | date('YYYY-MM-DD')}}"
    fields:
      - { name: titulo, label: Título, widget: string }
      - { name: publicado, label: Publicado, widget: boolean, default: false }
      - { name: texto, label: Texto, widget: text, required: false }
      - { name: imagen, label: Imagen, widget: image }
      - name: enlace
        label: Enlace
        widget: string
        hint: Ruta interna (p. ej. /noticias/mi-noticia o /p/mi-pagina) o URL externa.
      - { name: inicio, label: Inicio de vigencia, widget: datetime, input_timezone: America/Santiago }
      - { name: fin, label: Fin de vigencia, widget: datetime, input_timezone: America/Santiago }

  # ── Páginas institucionales ─────────────────────────────────

  - name: paginas
    label: Páginas
    files:
      - name: inicio
        label: Inicio
        file: /app/web/src/content/inicio/inicio.md
        fields:
          - name: secciones
            label: Secciones destacadas
            widget: list
            required: false
            hint: "Se muestran al final del Inicio, en el orden de esta lista. Se pueden agregar más secciones o quitarlas. Para ocultar una sin borrarla, desmarca «Publicado»."
            label_singular: Sección destacada
            summary: "{{titulo}}{{publicado | ternary('', ' (oculta)')}}"
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: texto, label: Texto, widget: text }
              - { name: boton, label: Texto del botón, widget: string, hint: "Ej.: Ir al Directorio." }
              - name: enlace
                label: Enlace del botón
                widget: string
                hint: "Ruta interna que empieza con / (ej.: /directorio) o una dirección completa que empieza con https://."
                pattern: ['^(/(?!/)|https://)', 'Debe empezar con / (ruta interna) o con https://']
              - { name: imagen, label: Imagen de fondo, widget: image, hint: "Foto horizontal. Se oscurece para que el texto se lea." }
              - { name: imagen_alt, label: Texto alternativo de la imagen, widget: string, required: false, hint: "Descripción de la imagen para lectores de pantalla. Déjalo vacío si la imagen es solo decorativa." }
              - { name: publicado, label: Publicado, widget: boolean, default: true }
          - name: comunidad
            label: Comunidad y documentos
            widget: object
            required: false
            collapsed: false
            hint: "Banda del Inicio con una tarjeta para el Directorio y otra para el Repositorio. Si desactivas una sección en «Secciones del sitio», su tarjeta no sale; si desactivas las dos, no sale la banda."
            fields:
              - { name: titulo, label: Título de la banda, widget: string, default: "Comunidad y documentos", hint: "Encabezado de la banda." }
              - name: directorio
                label: Tarjeta del Directorio
                widget: object
                fields:
                  - { name: titulo, label: Título, widget: string, default: "Directorio de bioingenieros/as" }
                  - { name: texto, label: Texto, widget: text, default: "Encuentra egresados/as por generación, área y organización." }
                  - { name: boton, label: Texto del botón, widget: string, default: "Ir al Directorio", hint: "Lleva al Directorio completo." }
                  - { name: imagen, label: Foto (opcional), widget: image, required: false, hint: "Foto pequeña y horizontal. Sin foto, la tarjeta se ve igual." }
                  - { name: imagen_alt, label: Texto alternativo de la foto, widget: string, required: false, hint: "Describe la foto para lectores de pantalla. Déjalo vacío si es solo decorativa." }
              - name: repositorio
                label: Tarjeta del Repositorio
                widget: object
                fields:
                  - { name: titulo, label: Título, widget: string, default: "Repositorio de documentos" }
                  - { name: texto, label: Texto, widget: text, default: "Decretos, reglamentos, informes y publicaciones de la carrera, en un solo lugar." }
                  - { name: boton, label: Texto del botón, widget: string, default: "Ir al Repositorio", hint: "Lleva al Repositorio completo." }
                  - { name: imagen, label: Foto (opcional), widget: image, required: false, hint: "Foto pequeña y horizontal. Sin foto, la tarjeta se ve igual." }
                  - { name: imagen_alt, label: Texto alternativo de la foto, widget: string, required: false, hint: "Describe la foto para lectores de pantalla. Déjalo vacío si es solo decorativa." }
      - name: menu
        label: Secciones del sitio
        file: /app/web/src/content/menu/menu.yml
        format: yml
        fields:
          - { name: noticias, label: "Mostrar «Noticias» en el menú", widget: boolean, default: true, hint: "Si lo desactivas, la sección sale del menú y del pie, pero su página sigue existiendo." }
          - { name: agenda, label: "Mostrar «Agenda» en el menú", widget: boolean, default: true, hint: "Si lo desactivas, la sección sale del menú y del pie, pero su página sigue existiendo." }
          - { name: instagram, label: "Sección «Instagram» activa", widget: boolean, default: true, hint: "Si la desactivas, deja de publicarse: sale del menú, del pie, del Inicio y del buscador, y su dirección da error 404. El contenido no se borra." }
          - { name: directorio, label: "Sección «Directorio» activa", widget: boolean, default: true, hint: "Si la desactivas, deja de publicarse: sale del menú, del pie, del Inicio y del buscador, y su dirección da error 404. El contenido no se borra." }
          - name: formulario_directorio
            label: "Formulario del Directorio (Google Form)"
            widget: string
            required: false
            pattern: ['^https://', 'Debe empezar con https://']
            hint: "Enlace al formulario para sumarse al Directorio, p. ej.: https://docs.google.com/forms/d/e/TU_ID/viewform. Déjalo vacío si aún no hay formulario: el Inicio y /directorio no muestran el botón."
          - name: sumarse_icono
            label: "Ícono del bloque «¿Eres egresado/a?»"
            widget: select
            required: false
            options: &iconos_phosphor
              - { label: Periódico, value: Newspaper }
              - { label: Calendario, value: CalendarDots }
              - { label: Megáfono, value: Megaphone }
              - { label: Libros, value: Books }
              - { label: Grupo, value: UsersThree }
              - { label: Instagram, value: InstagramLogo }
              - { label: Matraz, value: Flask }
              - { label: ADN, value: Dna }
              - { label: Microscopio, value: Microscope }
              - { label: Átomo, value: Atom }
              - { label: Hoja, value: Leaf }
              - { label: Birrete, value: GraduationCap }
              - { label: Maletín, value: Briefcase }
              - { label: Acuerdo, value: Handshake }
              - { label: Idea, value: Lightbulb }
              - { label: Estrella, value: Star }
              - { label: Corazón, value: Heart }
              - { label: Cohete, value: Rocket }
              - { label: Trofeo, value: Trophy }
              - { label: Globo terráqueo, value: Globe }
              - { label: Ubicación, value: MapPin }
              - { label: Documento, value: FileText }
              - { label: Carpeta, value: Folder }
              - { label: Gráfico, value: ChartBar }
              - { label: Código, value: Code }
              - { label: Engranaje, value: Gear }
              - { label: Información, value: Info }
              - { label: Pregunta, value: Question }
              - { label: Destello, value: Sparkle }
