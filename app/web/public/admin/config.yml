            label: Descripción del sitio
            widget: text
            required: false
            maxlength: 160
            hint: "Una o dos frases que describan la carrera. Aparece en Google y al compartir el sitio. Si la dejas vacía, se usa el texto por defecto."
          - name: imagen
            label: Imagen para compartir por defecto
            widget: image
            required: false
            hint: "Horizontal, de 1200 × 630 px. Se usa cuando una página no trae su propia imagen. Si la dejas vacía, se usa la imagen por defecto del sitio."
          - name: listados
            label: Descripción e imagen de cada listado
            widget: object
            collapsed: true
            required: false
            hint: "Para cada página de listado: el texto que aparece en Google y la imagen al compartirla en redes. Si los dejas vacíos, se usan los valores por defecto del sitio."
            fields:
              - name: inicio
                label: Inicio
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: descripcion, label: Descripción en buscadores y redes, widget: text, required: false, maxlength: 160, hint: "Una o dos frases. Si la dejas vacía, se usa el texto por defecto." }
                  - { name: imagen, label: Imagen para compartir, widget: image, required: false, hint: "Horizontal, de 1200 × 630 px. Si la dejas vacía, se usa la imagen por defecto del sitio." }
              - name: noticias
                label: Noticias
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: descripcion, label: Descripción en buscadores y redes, widget: text, required: false, maxlength: 160, hint: "Una o dos frases. Si la dejas vacía, se usa el texto por defecto." }
                  - { name: imagen, label: Imagen para compartir, widget: image, required: false, hint: "Horizontal, de 1200 × 630 px. Si la dejas vacía, se usa la imagen por defecto del sitio." }
              - name: agenda
                label: Agenda
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: descripcion, label: Descripción en buscadores y redes, widget: text, required: false, maxlength: 160, hint: "Una o dos frases. Si la dejas vacía, se usa el texto por defecto." }
                  - { name: imagen, label: Imagen para compartir, widget: image, required: false, hint: "Horizontal, de 1200 × 630 px. Si la dejas vacía, se usa la imagen por defecto del sitio." }
              - name: anuncios
                label: Anuncios
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: descripcion, label: Descripción en buscadores y redes, widget: text, required: false, maxlength: 160, hint: "Una o dos frases. Si la dejas vacía, se usa el texto por defecto." }
                  - { name: imagen, label: Imagen para compartir, widget: image, required: false, hint: "Horizontal, de 1200 × 630 px. Si la dejas vacía, se usa la imagen por defecto del sitio." }
              - name: repositorio
                label: Repositorio
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: descripcion, label: Descripción en buscadores y redes, widget: text, required: false, maxlength: 160, hint: "Una o dos frases. Si la dejas vacía, se usa el texto por defecto." }
                  - { name: imagen, label: Imagen para compartir, widget: image, required: false, hint: "Horizontal, de 1200 × 630 px. Si la dejas vacía, se usa la imagen por defecto del sitio." }
              - name: directorio
                label: Directorio
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: descripcion, label: Descripción en buscadores y redes, widget: text, required: false, maxlength: 160, hint: "Una o dos frases. Si la dejas vacía, se usa el texto por defecto." }
                  - { name: imagen, label: Imagen para compartir, widget: image, required: false, hint: "Horizontal, de 1200 × 630 px. Si la dejas vacía, se usa la imagen por defecto del sitio." }
              - name: instagram
                label: Instagram
                widget: object
                collapsed: true
                required: false
                fields:
