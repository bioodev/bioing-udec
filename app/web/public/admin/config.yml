            widget: relation
            collection: areas
            display_fields: [nombre]
            multiple: true
            required: false
            hint: "En qué campos trabaja o se especializa. Se eligen de la lista «Áreas»."
          - name: organizacion
            label: Organización
            widget: relation
            collection: organizaciones
            display_fields: [nombre]
            required: false
            hint: "Dónde trabaja. Se elige de la lista «Organizaciones»."
          - { name: cargo, label: Cargo / profesión, widget: string, required: false, hint: 'Cómo se presenta profesionalmente, p. ej. "Gerente de calidad". Déjalo vacío si no corresponde.' }
          - name: enlaces
            label: Enlaces profesionales
            label_singular: Enlace
            widget: list
            required: false
            hint: "Perfiles o sitios profesionales, p. ej. LinkedIn. Se muestran en su ficha."
