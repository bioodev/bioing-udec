            required: false
            hint: "Número o año de la generación, p. ej. 2015. Se usa para agrupar en el Directorio. Déjalo vacío si no se sabe."
          - { name: anio_egreso, label: Año de egreso, widget: number, value_type: int, hint: "Año en que terminó la carrera, p. ej. 2019." }
          - name: areas
