          - { name: url, label: Enlace, widget: string, type: url, hint: "Copia la dirección de la barra del navegador." }
          - { name: titulo, label: Título, widget: string, required: false, hint: "Describe el contenido; lo leen los lectores de pantalla." }
      - *seo_contenido
  - name: instagram
    label: Instagram
    label_singular: Publicación de Instagram
    icon: photo_camera
    description: 'Publicaciones de Instagram que se muestran en la sección Instagram y en el Inicio.'
    folder: /app/web/src/content/instagram
    editor:
      preview: false
    format: yml
    identifier_field: titulo
    summary: "{{titulo}} · {{fecha | date('YYYY-MM-DD')}} {{publicado | ternary('', '(borrador)')}}"
    fields:
      - { name: titulo, label: Título de la tarjeta, widget: string, hint: "Frase corta que se ve como título de la publicación. También la leen los lectores de pantalla." }
      - name: enlace
        label: Enlace de la publicación
        widget: string
        hint: Copia el enlace desde Instagram (Compartir → Copiar enlace). Solo publicaciones o reels.
        pattern: ['^https://(www\.)?instagram\.com/(p|reel)/[\w-]+/?(\?.*)?$', 'Debe ser el enlace de una publicación o reel de Instagram']
      - { name: fecha, label: Fecha de la publicación, widget: datetime, type: date, hint: "Las publicaciones más recientes se muestran primero." }
      - { name: publicado, label: Publicado, widget: boolean, default: false, hint: "Desmarca «Publicado» para ocultar la publicación sin borrarla." }
      - { name: imagen, label: Miniatura (opcional), widget: image, required: false, hint: "Captura de la publicación. Se ve en la tarjeta antes de cargar Instagram." }
  - divider: true
  # ── Comunidad ───────────────────────────────────────────────
  - name: personas
    label: Personas
    label_singular: Persona
    icon: group
    description: 'Integrantes de la comunidad: egresados/as, estudiantes, académicos/as e invitados/as. Pueden aparecer en noticias, actividades y anuncios.'
    folder: /app/web/src/content/personas
    format: yml
    identifier_field: nombre
    summary: '{{nombre}}'
    fields:
      - { name: nombre, label: Nombre y apellido, widget: string }
      - name: ficha_activa
        label: Tiene ficha pública
        widget: boolean
        default: true
        hint: "Si desmarcas «Tiene ficha pública», su nombre aparece sin enlace en noticias y actividades, y deja de salir en el Directorio."
      - name: descripcion
        label: Descripción breve
        widget: string
        required: false
        hint: 'Aparece bajo su nombre en su ficha. Ej.: "Académica FCB", "Estudiante de Bioingeniería".'
      - { name: foto, label: Foto, widget: image, required: false, hint: "Se muestra en su ficha, en forma de círculo. Déjala vacía si no hay." }
      - name: perfil_egresado
        label: Perfil de egresado
        widget: object
        required: false
        collapsed: true
        hint: "Solo para egresados/as titulados de la carrera. Sus datos aparecen en el Directorio únicamente si autorizan publicarlos."
